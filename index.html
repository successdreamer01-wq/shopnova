<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPNOVA | Discover More. Shop Better.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 👑 SECTION 01: PREMIUM NAVBAR -->
    <header class="navbar">
        <div class="container nav-wrap">
            <div class="brand-logo">
                <span class="crown">👑</span> SHOP<span>NOVA</span>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="deals.html">🔥 Deals</a>
                <a href="trending.html">⭐ Trending</a>
                <a href="wishlist.html">❤️ Wishlist</a>
            </nav>
            <div class="nav-right">
                <button class="search-trigger">🔎</button>
            </div>
        </div>
    </header>

    <!-- 🎬 SECTION 02: CINEMATIC HERO (The Poster) -->
    <section class="hero-poster">
        <div class="poster-overlay"></div>
        <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80" class="poster-img" alt="Shopping Poster">
        <div class="hero-content">
            <h1 class="hero-headline">हर शानदार Deal, एक ही जगह!</h1>
            <p class="hero-subtext">बेहतर खोजिए, समझदारी से खरीदिए। Amazon, Flipkart और Meesho के बेहतरीन विकल्प अब आपकी उंगलियों पर।</p>
            <div class="search-portal">
                <input type="text" placeholder="आप क्या खोज रहे हैं?">
                <button class="search-btn">खोजें</button>
            </div>
        </div>
    </section>

    <!-- 🔒 SECTION 03: TRUST STRIP -->
    <section class="trust-strip">
        <div class="container trust-grid">
            <div class="trust-card"><span>🔎</span> Compare Prices</div>
            <div class="trust-card"><span>💰</span> Best Value</div>
            <div class="trust-card"><span>⭐</span> Verified Products</div>
            <div class="trust-card"><span>🔒</span> Trusted Platforms</div>
        </div>
    </section>

    <!-- ⚖️ SECTION 07: SMART COMPARISON -->
    <section class="comparison-section container">
        <h2 class="section-heading">⚖️ कहाँ बेहतर Deal मिल रही है?</h2>
        <div class="comparison-grid" id="home-deals-grid">
            <!-- Products will load here via script.js -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
