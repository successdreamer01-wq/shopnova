<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPNOVA | Discover More. Shop Better.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECTION 01: PREMIUM NAVBAR -->
    <header class="navbar">
        <div class="container nav-wrap">
            <div class="logo">SHOPNOVA</div>
            <nav class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Categories</a>
                <a href="#">🔥 Deals</a>
                <a href="#">⭐ Trending</a>
                <a href="#">❤️ Wishlist</a>
            </nav>
            <div class="nav-right">
                <button class="search-trigger">🔎</button>
            </div>
        </div>
    </header>

    <!-- SECTION 02: CINEMATIC HERO -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-headline">हर शानदार Deal, एक ही जगह!</h1>
                <p class="hero-subtext">Amazon, Flipkart और Meesho के शानदार Products और Deals खोजें, Compare करें और अपने लिए बेहतर विकल्प चुनें।</p>
                
                <!-- Intelligent Search Bar -->
                <div class="search-container">
                    <div class="search-bar">
                        <input type="text" placeholder="आप क्या खोज रहे हैं?">
                        <button class="search-btn">खोजें</button>
                    </div>
                    <div class="search-suggestions">
                        <span>🔥 Popular:</span>
                        <a href="#">Smartphones</a>
                        <a href="#">Laptops</a>
                        <a href="#">Airpods</a>
                    </div>
                </div>

                <div class="hero-ctas">
                    <button class="btn-main">🔥 Best Deals</button>
                    <button class="btn-outline">⭐ Trending</button>
                </div>
            </div>
        </div>
        
        <!-- Subtle Visual Element -->
        <div class="hero-visual"></div>
    </section>

</body>
</html>
