<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPNOVA | Discover More. Shop Better.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECTION 01 — PREMIUM NAVBAR -->
    <nav class="navbar">
        <div class="logo">👑 SHOPNOVA</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Categories</a>
            <a href="#">🔥 Deals</a>
            <a href="#">⭐ Trending</a>
            <a href="#">❤️ Wishlist</a>
        </div>
        <div class="search-nav">
            <input type="text" placeholder="Search products...">
        </div>
    </nav>

    <!-- SECTION 02 — CINEMATIC HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>हर शानदार <span class="highlight">Deal</span>, एक ही जगह!</h1>
            <p>Amazon, Flipkart और Meesho के शानदार Products और Deals खोजें, Compare करें और अपने लिए बेहतर विकल्प चुनें।</p>
            
            <div class="hero-search">
                <input type="text" placeholder="🔎 आप क्या खोज रहे हैं?">
                <button>खोजें</button>
            </div>

            <div class="hero-ctas">
                <button class="cta-primary">🔥 Best Deals</button>
                <button class="cta-secondary">⭐ Trending</button>
            </div>
        </div>
    </section>

</body>
</html>
