<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - SHOPNOVA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-wrap">
            <div class="logo">SHOPNOVA</div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="listing.html">Categories</a>
                <a href="deals.html">🔥 Deals</a>
                <a href="trending.html">⭐ Trending</a>
                <a href="wishlist.html">❤️ Wishlist</a>
            </nav>
            <div class="nav-right">
                <div class="search-bar" style="display: flex; background: #eee; padding: 5px; border-radius: 50px;">
                    <input type="text" placeholder="खोजें..." style="border:none; background:none; padding: 0 10px; outline:none;">
                    <button class="search-btn" style="border:none; background:#000; color:#fff; border-radius:50px; padding: 5px 15px; cursor:pointer;">Go</button>
                </div>
            </div>
        </div>
    </header>

    <!-- SEARCH HEADER -->
    <section class="search-header-area" style="padding: 60px 0; background: #f9f9f9; text-align: center;">
        <div class="container">
            <h1 class="search-title">खोज के परिणाम: <span class="search-query" style="color: #00FF88;">...</span></h1>
            <p>हमने आपके लिए सबसे बेहतरीन डील्स ढूँढ निकाली हैं।</p>
        </div>
    </section>

    <!-- RESULTS GRID -->
    <div class="container search-layout" style="padding: 40px 0;">
        <!-- यही वो जगह है जहाँ प्रोडक्ट्स अपने आप दिखेंगे -->
        <div class="product-grid" id="search-results-grid"></div>
    </div>

    <footer class="container center" style="padding: 60px 0; color: #888; text-align:center;">
        <p>&copy; 2024 SHOPNOVA. All rights reserved.</p>
    </footer>

    <!-- दिमाग (JS) को जोड़ना -->
    <script src="script.js"></script>

</body>
</html>
